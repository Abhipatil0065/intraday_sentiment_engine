<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intraday News Sentiment &amp; Market Impact Engine</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922; --panel2:#1a2029; --line:#232b3a;
    --txt:#e6edf3; --dim:#8b98a9; --gold:#f0b429; --silver:#c0c8d1;
    --btc:#f7931a; --bull:#2ea043; --bear:#f85149; --neu:#6e7681;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--txt);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  header{
    position:sticky;top:0;z-index:20;padding:9px 18px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  header h1{font-size:12px;letter-spacing:2px;font-weight:600;margin-bottom:5px}
  .meta{font-size:11px;color:var(--dim);display:flex;gap:15px;flex-wrap:wrap}
  .meta b{color:var(--txt);font-weight:600}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
       background:var(--neu);margin-right:5px;vertical-align:middle}
  .dot.on{background:var(--bull);box-shadow:0 0 6px var(--bull)}
  main{max-width:1500px;width:100%;margin:0 auto;padding:14px 18px 26px}
  h2{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700;
     margin:22px 0 9px;display:flex;gap:9px;align-items:baseline}
  h2 .n{color:var(--txt);font-weight:400;letter-spacing:0}
  .regime{background:var(--panel);border:1px solid var(--line);border-radius:10px;
          padding:10px 15px;font-size:11.5px;color:var(--dim)}
  .regime b{color:var(--txt)}
  .regime ul{list-style:none;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
  .regime li{border-left:2px solid var(--gold);padding-left:8px}

  /* ---- top market-prep summary strip (GOLD / SILVER / BITCOIN) ---- */
  .strip-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
              padding:0 2px 10px}
  .strip-head .st{font-size:12px;letter-spacing:2px;color:var(--dim);font-weight:700}
  .strip-head .ss{font-size:11px;color:var(--dim)}
  .strip-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         border-left:5px solid var(--accent);padding:16px 18px;cursor:pointer;
         display:flex;flex-direction:column;gap:12px;transition:background .12s}
  .mcard:hover{background:var(--panel2);border-color:var(--dim);
               border-left-color:var(--accent)}
  .mcard.gold{--accent:var(--gold)}
  .mcard.silver{--accent:var(--silver)}
  .mcard.bitcoin{--accent:var(--btc)}
  .mtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .mname{font-size:22px;font-weight:700;letter-spacing:1.2px;line-height:1.1}
  .msym{font-size:12px;color:var(--dim);letter-spacing:1px}
  .mrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:14px}
  .mlabel{font-size:11.5px;letter-spacing:1.4px;color:var(--dim)}
  .msess{color:var(--txt);font-weight:700}
  .msub{font-size:12px;color:var(--dim);letter-spacing:.4px;margin-top:-5px}
  /* ---- bull/bear split bar ------------------------------------------------
   The thin bar shows the SAME bull/bear split the headline percentage is
   drawn from, so the number and the bar can never disagree. The split comes
   from the server's `display` block, which derives it from the score - the
   JavaScript only picks widths, it never decides a direction.

   These override the older centred-diverging .bar rules below, which assumed
   <div class="b">/<div class="s"> children positioned from the midpoint. The
   markup is now two plain spans sized to the split, and NO_BIAS greys both
   sides so a withheld verdict reads as withheld. */
.mcard .bar{height:18px;border-radius:9px;display:flex;overflow:hidden;
            background:var(--neu);position:static}
.mcard .bar::after{display:none}
.mcard .bar .bu{position:static;display:block;height:100%;flex:0 0 auto;
               background:var(--bull)}
.mcard .bar .be{position:static;display:block;height:100%;flex:1 1 auto;
               background:var(--bear)}
.mcard .bar.neu .bu,.mcard .bar.neu .be{background:var(--neu)}
/* ---- two-sided split BOXES under the bar --------------------------------
   Under the split line each side gets its own boxed figure: the BULLISH
   percentage in a green box, the BEARISH percentage in a red box. Sized to
   read as a headline number rather than a caption, because for a NO_BIAS card
   this pair IS the verdict - there is no named side to lean on.

   Both boxes always print, even when the engine names one side. That is the
   point: the reader sees how lopsided the split actually is.

   For a NEUTRAL card both boxes are greyed via .neu. The numbers still describe
   the engine's real split (a score of +3 is genuinely 52/48), but nothing on
   the card may look like a directional call the engine declined to make. The
   LABEL always comes from bias - these boxes colour it, they never decide it. */
.mcard .bpct{display:flex;justify-content:space-between;align-items:stretch;
            gap:10px;margin-top:9px}
.mcard .bpct .side{flex:1 1 0;display:flex;flex-direction:column;
                   align-items:center;gap:2px;padding:7px 6px;border-radius:8px;
                   border:1px solid transparent;background:var(--panel2)}
/* Green box for the bullish figure, red for the bearish one. */
.mcard .bpct .side.bull{border-color:rgba(46,160,67,.55);
                        background:rgba(46,160,67,.14)}
.mcard .bpct .side.bear{border-color:rgba(248,81,73,.55);
                        background:rgba(248,81,73,.14)}
.mcard .bpct .cap{font-size:9.5px;letter-spacing:1.4px;color:var(--dim)}
.mcard .bpct .fig{font-size:22px;font-weight:700;line-height:1.1;
                  font-variant-numeric:tabular-nums}
.mcard .bpct .side.bull .fig{color:var(--bull)}
.mcard .bpct .side.bear .fig{color:var(--bear)}
/* No greyed variant. The boxes are permanently green/red, including on a
   NEUTRAL card, so all three asset cards read identically. Bitcoin in
   particular sits on the NO_BIAS boundary and flickered between coloured and
   grey as its confidence crossed the floor, which read as a broken card.

   The withheld call is still stated plainly where it belongs: the verdict chip
   above stays grey and says NEUTRAL, and the split bar greys too. The boxes
   answer "what is the split", never "which way does the engine lean". */

/* The verdict chip is the primary read: label + one percentage. */
.mcard .verdict{font-size:15px;font-weight:700;letter-spacing:1.2px;
               padding:7px 15px;border-radius:6px;display:inline-block}
.mcard .verdict.BULLISH{background:rgba(46,160,67,.16)}
.mcard .verdict.BEARISH{background:rgba(248,81,73,.16)}
.mcard .verdict.NO_BIAS{background:rgba(110,118,129,.16)}
/* The .mstats / .mstat boxed-number grid backed the removed SCORE/CONF tiles.
   No markup references it now, so it is dropped rather than left as dead CSS. */
  .mdrv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mcard .note li{font-size:11px;color:var(--txt)}
  .mcard .note .none{font-size:10.5px;color:var(--dim);font-style:italic}
  .mfoot{display:flex;align-items:center;gap:13px;flex-wrap:wrap;font-size:11px;
         color:var(--dim);border-top:1px solid var(--line);padding-top:9px;
         margin-top:auto}
  .mfoot b{font-weight:700;color:var(--txt);font-size:12px}
  .hr{height:1px;background:var(--line);margin:15px 0 0}

  .asset{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         border-left:5px solid var(--accent);margin-bottom:14px;overflow:hidden;
         scroll-margin-top:62px}
  .asset.gold{--accent:var(--gold)}
  .asset.silver{--accent:var(--silver)}
  .asset.bitcoin{--accent:var(--btc)}
  .ahead{display:flex;align-items:center;gap:14px;padding:11px 15px;
         border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
  .name{font-size:16px;font-weight:700;letter-spacing:1.2px;line-height:1.15}
  .sym{font-size:10.5px;color:var(--dim);letter-spacing:1px}
  .tagline{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .scope{padding:11px 15px;border-bottom:1px dashed var(--line)}
  .scope:last-child{border-bottom:0}
  .shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .stitle{font-size:11px;letter-spacing:1.6px;font-weight:700}
  .ssub{font-size:10px;color:var(--dim)}
  .verdict{font-size:10px;font-weight:700;letter-spacing:1px;border:1px solid var(--line);
           border-radius:5px;padding:3px 9px;white-space:nowrap}
  .verdict.BULLISH{color:var(--bull);border-color:var(--bull)}
  .verdict.BEARISH{color:var(--bear);border-color:var(--bear)}
  .verdict.MIXED{color:var(--gold);border-color:var(--gold)}
  .verdict.NEUTRAL{color:var(--dim)}
  /* Item 2: NO_BIAS is a real, first-class answer. It must look deliberate,
     not like a rendering error or an empty state. */
  .verdict.NO_BIAS{color:var(--dim);border-color:var(--dim);border-style:dashed}
  .mfoot .risk{color:var(--bear);font-weight:700;letter-spacing:.5px}
  /* Score bar is a CENTRED diverging bar, not a 100% stacked pair: the fill
     starts at the midpoint and grows left or right from there. */
  .bar{position:relative;display:block;height:15px;border-radius:8px;
       background:#1b2130;overflow:hidden}
  .bar::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;
       background:var(--line)}
  .bar div{position:absolute;top:0;bottom:0;height:100%}
  .bar .b{left:50%}
  .bar .s{right:50%}
  .bar .b{background:var(--bull)}
  .bar .s{background:var(--bear)}
  .note{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
        padding:8px 11px}
  .note h4{font-size:9.5px;letter-spacing:1.5px;color:var(--dim);font-weight:700;
           margin-bottom:5px}
  .note ul{list-style:none;display:flex;flex-direction:column;gap:4px}
  .note li{font-size:10.5px;line-height:1.4;color:var(--dim);
           padding-left:8px;border-left:2px solid var(--line)}
  .note.drv h4{color:var(--bull)} .note.drv li{border-left-color:var(--bull)}
  .note.rsk h4{color:var(--bear)} .note.rsk li{border-left-color:var(--bear)}
  /* The MARKET PREP card's two driver boxes: bullish on the left, bearish on
     the right. They reuse the drv/rsk colours above, so the pairing reads the
     same way as the green/red percentage boxes above them. */
  .note.bull h4{color:var(--bull)} .note.bull li{border-left-color:var(--bull)}
  .note.bear h4{color:var(--bear)} .note.bear li{border-left-color:var(--bear)}
  .note.cat h4{color:var(--gold)} .note.cat li{border-left-color:var(--gold)}
  /* Economic calendar rows - visibly distinct from news headlines. */
  .cal{border-left:2px solid var(--gold);padding:6px 0 6px 10px;margin-top:8px}
  .calh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .calt{font-size:11.5px;font-weight:700;color:var(--txt)}
  .calm{font-size:10px;color:var(--dim);letter-spacing:.3px}
  .cali{font-size:9px;color:var(--dim);border:1px solid var(--line);
        border-radius:4px;padding:1px 5px;margin-left:auto}
  .cal .row{font-size:10.5px;color:var(--dim);margin-top:3px}
  .cal .row b{color:var(--txt)}
  .alert{background:rgba(248,81,73,.06);border:1px solid rgba(248,81,73,.3);
         border-left-width:4px;border-radius:8px;padding:9px 13px;margin-bottom:8px;
         font-size:11.5px;line-height:1.45}
  .alert .ah{font-weight:700;letter-spacing:.6px;color:var(--bear);font-size:10px}
  .alert .am{color:var(--dim);font-size:10px;margin-top:3px}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
  .filters button{background:var(--panel);color:var(--dim);border:1px solid var(--line);
                  border-radius:14px;padding:4px 12px;font:inherit;font-size:10.5px;
                  cursor:pointer;letter-spacing:.5px}
  .filters button:hover{color:var(--txt);border-color:var(--dim)}
  .filters button.on{background:var(--panel2);color:var(--txt);border-color:var(--txt)}
  .fcount{font-size:10px;color:var(--dim);margin-left:auto}
  .feed{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        overflow:hidden}
  .item{border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .ihead{display:flex;gap:11px;align-items:baseline;padding:8px 13px;cursor:pointer}
  .ihead:hover{background:var(--panel2)}
  .ihead .time{font-size:10px;color:var(--dim);flex:0 0 auto;white-space:nowrap}
  .ihead .ttl{font-size:12px;flex:1 1 auto;min-width:0;overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}
  .item.open .ihead .ttl{white-space:normal}
  .tag{font-size:9px;letter-spacing:.6px;padding:2px 6px;border-radius:4px;
       border:1px solid var(--line);color:var(--dim);flex:0 0 auto;white-space:nowrap}
  .tag.VERY_HIGH,.tag.HIGH{color:var(--bear);border-color:rgba(248,81,73,.45)}
  .tag.MEDIUM{color:var(--gold);border-color:rgba(240,180,41,.4)}
  .ibody{display:none;padding:10px 13px 13px;border-top:1px dashed var(--line);
         font-size:11px;color:var(--dim);line-height:1.5}
  .item.open .ibody{display:block}
  .sum{color:var(--txt);margin-bottom:8px}
  .meta-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .impacts{margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .imp{border-left:2px solid var(--line);padding-left:10px}
  .imp .ih{font-size:11px;font-weight:700;color:var(--txt);letter-spacing:.5px;
           margin-bottom:2px}
  .imp .row{font-size:10.5px}
  .imp .row b{color:var(--txt)}
  .wnote{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);
         font-size:10px;font-style:italic;color:var(--dim)}
  .empty{color:var(--dim);font-size:11.5px;padding:14px;text-align:center}
  .feedmore{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
            padding:12px 2px 4px;margin-top:4px;
            border-top:1px dashed var(--line)}
  .feedmore button{background:var(--panel2);border:1px solid var(--line);
            color:var(--txt);font:inherit;font-size:11.5px;padding:7px 14px;
            border-radius:6px;cursor:pointer;letter-spacing:.4px}
  .feedmore button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
  .feedmore button:disabled{opacity:.5;cursor:default}

  /* ---- FinancialJuice Session Analysis (five fixed boxes) ---- */
  .fjhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
          padding:0 2px 10px}
  .fjhead .ft{font-size:12px;letter-spacing:2px;color:var(--txt);font-weight:700}
  .fjhead .fd{font-size:12px;color:var(--gold);font-weight:600}
  .fjhead .fz{font-size:10.5px;color:var(--dim)}
  .fjbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:13px 16px;margin-bottom:12px;scroll-margin-top:64px}
  .fjbox.pending{opacity:.62}
  .fjbh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
        padding-bottom:9px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .fjbh .n{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:1px}
  .fjbh .nm{font-size:12.5px;letter-spacing:1.6px;font-weight:700}
  .fjbh .ts{margin-left:auto;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .fjbadge{font-size:9.5px;font-weight:700;letter-spacing:1.1px;padding:3px 8px;
          border-radius:5px;border:1px solid var(--line);color:var(--dim);
          background:var(--panel2);white-space:nowrap}
  .fjbadge.today{color:var(--bull);border-color:rgba(46,160,67,.55);
          background:rgba(46,160,67,.10)}
  .fjbadge.prev{color:var(--gold);border-color:rgba(240,180,41,.5);
          background:rgba(240,180,41,.09)}
  .fjprevnote{font-size:10px;color:var(--gold);opacity:.85;margin-top:2px}
  .fjctx{font-size:10.5px;color:var(--dim);margin:0 0 8px;padding:6px 10px;
         border-left:2px solid var(--gold);background:var(--panel2)}
  .fjctx b{color:var(--text)}
  /* LEGACY-SCORING BANNER: this section still emits the old forced
     Bullish+Bearish=100% split, unlike the rest of the dashboard which uses
     BULLISH/BEARISH/NO_BIAS. It is called out so the two are never compared. */
  .fjlegacy{font-size:10.5px;color:var(--gold);margin:0 0 11px;padding:7px 11px;
            border:1px dashed rgba(240,180,41,.45);border-radius:7px;
            background:rgba(240,180,41,.07);line-height:1.45}
  .fjrt{font-size:11px;color:var(--dim);margin-bottom:9px;font-style:italic}
  .fjgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .fja{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
       padding:10px 12px}
  .fja .an{font-size:10px;letter-spacing:1.3px;color:var(--dim);margin-bottom:6px}
  .fja .pct{font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .fja .pcb{font-size:11px;margin-top:3px;letter-spacing:.3px}
  .bull{color:var(--bull)} .bear{color:var(--bear)}
  .fja .bb{height:7px;border-radius:4px;overflow:hidden;display:flex;
          margin:8px 0 7px;background:#1b2130}
  .fja .bb .b{background:var(--bull)} .fja .bb .s{background:var(--bear)}
  .fja .dv{font-size:10.5px;color:var(--dim);line-height:1.4}
  /* Session-level TOP DRIVERS / KEY RISKS. Deliberately reuses the same
     .note.drv / .note.rsk component the MARKET PREP cards use, so all five
     session boxes read exactly like the three cards above them. */
  .fjdrv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;
         padding-top:9px;border-top:1px dashed var(--line)}
  .fjbox .note li{color:var(--txt)}
  .fjbox .note .none{font-size:10.5px;color:var(--dim);font-style:italic}
  .fjpending{font-size:11px;color:var(--dim);font-style:italic;padding:4px 0}
  @media (max-width:1000px){
    .strip-cards{grid-template-columns:1fr}
    .fjgrid{grid-template-columns:1fr}
  }
  footer{border-top:1px solid var(--line);color:#6e7681;font-size:10px;
         text-align:center;padding:9px 18px;margin-top:20px}
  @media (max-width:1000px){
    .strip-cards{grid-template-columns:1fr}
  }
  @media (max-width:700px){
    .tagline{margin-left:0;width:100%}
    .ihead .ttl{white-space:normal}
    .mcard .bar{height:10px}
    .fjdrv{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <h1>INTRADAY NEWS SENTIMENT &amp; MARKET IMPACT ENGINE</h1>
  <div class="meta" id="meta">Loading&hellip;</div>
</header>
<main>
  <div id="prepStrip"></div>
  <div id="regime"></div>
  <h2>FINANCIALJUICE SESSION ANALYSIS</h2>
  <div id="fjWrap"></div>
  <h2>SECTION A &mdash; ECONOMIC CALENDAR</h2>
  <div id="assets"></div>
  <div id="alertsWrap"></div>
  <h2>SECTION B &mdash; TODAY'S NEWS IMPACT FEED <span class="n" id="feedCount"></span></h2>
  <div class="filters" id="filters"></div>
  <div class="feed" id="feed"></div>
</main>
<footer id="disclaimer">News-based intraday sentiment. Not a price prediction, not financial advice.</footer>
<script>
let ws=null, backoff=1000, DATA=null, activeFilter='ALL';
/* Feed paging state. total = the whole day (from the API); loaded = how many
   rows are currently in memory across pages fetched so far. */
let FEED={items:[],total:0,loaded:0,page:60,busy:false};
function esc(s){return String(s==null?'':s)
  .replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function n1(v){return (Math.round((+v||0)*10)/10).toFixed(1);}
function w(v){return Math.max(0,Math.min(100,+v||0));}

/* ---- bull/bear split + verdict label ------------------------------------
   The engine's `display` block is authoritative for the LABEL and the SPLIT.
   It is computed server-side by app/analysis/display.py from score + bias, and
   this function only chooses widths and colours from it.

   The critical detail: the label is taken from `b.bias`, NEVER from the sign of
   the score or the size of the percentage. The engine deliberately returns
   NO_BIAS when its evidence is thin, and the score behind such a call is often
   a small non-zero number - so a sign-driven label would paint a withheld
   verdict green or red. Here NO_BIAS always renders grey NEUTRAL 50%. */
function disp(b){
  b=b||{};
  if(b.display && typeof b.display.pct==='number') return b.display;
  /* Fallback for a payload from a server that predates the display block.
     Same arithmetic, and the label still comes from bias, not from the sign. */
  var s=Math.max(-100,Math.min(100,+b.score||0));
  var bull=w(50+s/2);
  var bias=(b.bias||'NO_BIAS');
  return {label:bias==='BULLISH'?'BULLISH':bias==='BEARISH'?'BEARISH':'NEUTRAL',
          pct:bias==='BULLISH'?bull:bias==='BEARISH'?100-bull:50,
          bull_pct:bull, bear_pct:100-bull};
}
function verdictClass(label){
  /* Reuse the CSS classes the page already defines for a verdict chip
     (.BULLISH / .BEARISH / .NO_BIAS) so the new "LABEL n%" chip is styled by
     exactly the rules the old bias chip used, and NO_BIAS keeps its dashed
     grey "withheld" look. */
  return label==='BULLISH'?'BULLISH':label==='BEARISH'?'BEARISH':'NO_BIAS';
}
/* Thin bar showing the bull/bear split the headline percentage came from. */
function mbar(b){
  var d=disp(b);
  return '<div class="bar'+(d.label==='NEUTRAL'?' neu':'')+'">'
    +'<span class="bu" style="width:'+w(d.bull_pct)+'%"></span>'
    +'<span class="be" style="width:'+w(d.bear_pct)+'%"></span></div>';
}
/* BOTH sides as boxed figures, printed directly UNDER the bar line.
   One green box for the bullish percentage, one red box for the bearish one -
   the "old dashboard" split read, at headline size.

   The colours are PERMANENT and are keyed to the SIDE, not to the verdict: the
   bull box is always green and the bear box always red, including on a NEUTRAL
   card. Greying them for NO_BIAS was tried and reverted - it made the boxes
   flicker as a borderline asset crossed the floor, and read as a broken card.

   The withheld call is still visible: the verdict chip above and the split bar
   both grey and say NEUTRAL. These boxes only report the split. */
function msplit(b){
  var d=disp(b);
  return '<div class="bpct">'
    +'<div class="side bull"><span class="cap">BULLISH</span>'
    +'<span class="fig">'+Math.round(d.bull_pct)+'%</span></div>'
    +'<div class="side bear"><span class="cap">BEARISH</span>'
    +'<span class="fig">'+Math.round(d.bear_pct)+'%</span></div></div>';
}
function sessionChain(){
  if(!DATA) return '\u2014';
  return esc(DATA.previous_session)+' &rarr; '+esc(DATA.next_session);
}
/* TOP DRIVERS box - always drawn, "None flagged" when empty. Driver entries
   are objects {title, contribution, direction}, not bare strings. */
function mnote(cls,title,items,limit){
  var list=(items||[]), extra=Math.max(0,list.length-limit);
  var body=(!list.length)
    ? '<div class="none">None flagged.</div>'
    : '<ul>'+list.slice(0,limit).map(function(x){
        var t=(typeof x==='string')?x:(x.title||'');
        var c=(typeof x==='string')?null:(+x.contribution||0);
        return '<li>'+(c===null?'':(c>=0?'<b>+'+c.toFixed(3)+'</b> ':'<b>'+c.toFixed(3)+'</b> '))+esc(t)+'</li>';
      }).join('')
      +(extra?('<li>+' +extra+' more</li>'):'')+'</ul>';
  return '<div class="note '+cls+'"><h4>'+title+'</h4>'+body+'</div>';
}
/* Top strip: one compact MARKET PREP card per asset, gold / silver / bitcoin. */
function prepCard(a){
  var b=a.market_prep||{};
  var d=disp(b);
  var risk=b.event_risk?'<span class="risk">EVENT RISK</span>':'';
  return '<div class="mcard '+String(a.label||'').toLowerCase()
    +'" data-goto="asset-'+esc(a.symbol)+'" title="Jump to the '
    +esc(String(a.label||'').toUpperCase())+' economic calendar">'
    +'<div class="mtop"><span class="mname">'
    +esc(String(a.label||'').toUpperCase())+'</span>'
    +'<span class="msym">'+esc(a.symbol)+'</span></div>'
    +'<div class="mrow"><span class="mlabel">SESSIONS</span>'
    +'<span class="msess">'+sessionChain()+'</span></div>'
    +'<div class="mrow"><span class="mlabel">MARKET PREP</span>'
    +'<span class="verdict '+verdictClass(d.label)+'">'+d.label+' '+d.pct+'%</span>'
    +'</div>'
    +'<div class="msub">expected / forward-looking setup</div>'
    +mbar(b)
    +msplit(b)
    +'<div class="mdrv">'
    +mnote('bull','BULLISH DRIVERS',b.bull_drivers,3)
    +mnote('bear','BEARISH DRIVERS',b.bear_drivers,3)+'</div>'
    /* The conflicting headline explains a verdict that straddles zero, so it
       stays on the card next to the drivers rather than being dropped. */
    +(b.conflict?('<div class="msub">&#9888; conflicting headline: '
      +esc(b.conflict.title||'')+'</div>'):'')
    +'<div class="mfoot"><span>60min <b>'+n1(b.delta_60m)+'</b></span>'
    +'<span>mode <b>'+esc(b.mode||'heuristic')+'</b></span>'
    +'<span>n=<b>'+(+b.contributing_articles||0)+'</b></span>'
    +risk
    +'</div>'
    +'</div>';
}
function renderPrepStrip(assets){
  var box=document.getElementById('prepStrip');
  if(!assets||!assets.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="strip-head">'
    +'<span class="st">MARKET PREP &mdash; EXPECTED / FORWARD-LOOKING SETUP</span>'
    +'<span class="ss">SESSIONS '+sessionChain()+'</span></div>'
    +'<div class="strip-cards">'+assets.map(prepCard).join('')+'</div>'
    +'<div class="hr"></div>';
}
/* ---- Economic calendar ------------------------------------------------
   Scheduled macro releases weighed into the sentiment. Released prints use
   the realised actual-vs-forecast surprise; upcoming prints show consensus
   only and are labelled (expected) so they are never read as outcomes. */
function calRow(e){
  var released=(e.mode==='RELEASED');
  var vals='';
  if(e.actual!==null&&e.actual!==undefined){
    vals+=' actual <b>'+esc(String(e.actual))+'</b>';
  }
  if(e.forecast!==null&&e.forecast!==undefined){
    vals+=' &middot; forecast <b>'+esc(String(e.forecast))+'</b>';
  }
  if(e.previous!==null&&e.previous!==undefined){
    vals+=' &middot; prev '+esc(String(e.previous));
  }
  if(e.surprise!==null&&e.surprise!==undefined){
    vals+=' &middot; surprise <b>'+((+e.surprise>0)?'+':'')+esc(String(e.surprise))+'</b>';
  }
  var when='';
  try{
    when=new Date(e.when_utc).toISOString().slice(5,16).replace('T',' ');
  }catch(_){ when=''; }
  return '<div class="cal">'
    +'<div class="calh">'
      +'<span class="verdict '+esc(e.direction)+'">'+esc(e.direction)+'</span>'
      +'<span class="calt">'+esc(e.title)+'</span>'
      +'<span class="calm">'+(released?'':'(expected) ')+esc(e.country||'')
        +(when?(' &middot; '+esc(when)+' UTC'):'')+'</span>'
      +'<span class="cali">'+esc(e.impact||'')+'</span>'
    +'</div>'
    +'<div class="row">'+vals+'</div>'
    +'<div class="row"><b>Read:</b> '+esc(e.reason||'')+'</div>'
    +'<div class="row"><b>Transmission:</b> '+esc(e.transmission||'')+'</div>'
    +'</div>';
}
function calendarBlock(rows){
  if(!rows||!rows.length){
    return '<div class="scope"><div class="shead"><span class="stitle">'
      +'ECONOMIC CALENDAR</span><span class="ssub">weighed into sentiment'
      +'</span></div><div class="none">No qualifying macro releases inside '
      +'the forward-looking window.</div></div>';
  }
  return '<div class="scope"><div class="shead"><span class="stitle">'
    +'ECONOMIC CALENDAR</span><span class="ssub">weighed into sentiment'
    +'</span><span class="n">'+rows.length+'</span></div>'
    +rows.map(calRow).join('')+'</div>';
}
function renderAssets(assets){
  document.getElementById('assets').innerHTML=(assets||[]).map(function(a){
    var rows=(a.economic_calendar||[]).length;
    return '<div class="asset '+String(a.label||'').toLowerCase()

      +'<div class="ahead"><div>'
      +'<div class="name">'+esc(String(a.label||'').toUpperCase())+'</div>'
      +'<div class="sym">'+esc(a.symbol)+'</div></div>'
      +'<div class="tagline"><span class="ssub">SESSIONS</span>'
      +'<span class="ssub">'+esc(DATA.previous_session)+' &rarr; '
      +esc(DATA.next_session)+'</span>'
      +'<span class="ssub">'+rows+' MACRO RELEASES</span>'
      +'</div></div>'
      +calendarBlock(a.economic_calendar)
      +'</div>';
  }).join('');
}
function renderAlerts(alerts){
  var box=document.getElementById('alertsWrap');
  if(!alerts||!alerts.length){ box.innerHTML=''; return; }
  box.innerHTML='<h2>HIGH-IMPACT ALERTS <span class="n">'+alerts.length+'</span></h2>'
    +alerts.map(function(a){
      return '<div class="alert"><div class="ah">'+esc(a.asset)+' &middot; '
        +esc(a.direction)+' &middot; '+esc(a.severity)+' &middot; est. delta '

        +esc(a.created_at)+'</div><div class="am">'+esc(a.headline)
        +(a.reason?('<br>'+esc(a.reason)):'')+'</div></div>';

}
function impactRow(i){
  return '<div class="imp"><div class="ih">'+esc(i.asset)+' &middot; '
    +esc(i.direction)+' &middot; '+esc(i.strength)+'</div>'
    +'<div class="row"><b>Reason:</b> '+esc(i.reason||'')+'</div>'
    +'<div class="row"><b>Transmission:</b> '+esc(i.transmission||'')+'</div>'
    +(i.metal_character?('<div class="row"><b>Silver character:</b> '
      +esc(i.metal_character)+'</div>'):'')
    +'<div class="row">Recency <b>'+esc(i.recency_weight)+'</b> &middot; Econ <b>'
    +esc(i.importance_weight)+'</b> &middot; Relevance <b>'+n1(i.relevance)+'</b>'
    +' &middot; Session <b>'+esc(i.session)+'</b> &middot; Price <b>'
    +esc(i.price_confirmation)+'</b></div></div>';
}
function matches(it){
  if(activeFilter==='ALL') return true;
  if(activeFilter==='HIGH')
    return ['HIGH','VERY_HIGH'].indexOf(String(it.importance).toUpperCase())>=0;
  return (it.impacts||[]).some(function(i){return i.asset===activeFilter;});
}
function renderFeed(items){
  var list=(items||[]).filter(matches);
  var box=document.getElementById('feed');
  /* items.length is what is loaded; FEED.total is the whole day. Showing the
     loaded count as the denominator is what produced the misleading
     "60 of 60" - the two were the same number because the server had already
     capped the array at 60 before this ever ran. */
  document.getElementById('feedCount').textContent=
    '('+list.length+' shown of '+FEED.total+' today)';
  if(!list.length){
    box.innerHTML='<div class="empty">'+(FEED.total
      ?'No qualifying news for this filter among the '+FEED.loaded
       +' articles loaded. Load more to keep searching.'
      :'No qualifying news for today yet.')+'</div>';
    if(FEED.loaded<FEED.total) box.innerHTML+=moreButton();
    return;
  }
  box.innerHTML=list.map(function(it){
    var hits=(it.impacts||[]).map(function(i){return i.asset+' '+i.direction;});
    return '<div class="item"><div class="ihead">'
      +'<span class="time">'+esc(it.display_time)+'</span>'
      +'<span class="ttl">'+esc(it.title)+'</span>'
      +'<span class="tag '+esc(String(it.importance).toUpperCase())+'">'
      +esc(it.importance)+'</span>'
      +'<span class="tag">'+esc(it.source)+'</span>'
      +(hits.length?'<span class="tag">'+esc(hits.join(', '))+'</span>':'')
      +'</div><div class="ibody">'
      +(it.summary?('<div class="sum">'+esc(it.summary)+'</div>'):'')
      +'<div class="meta-row">'
      +'<span class="tag">Category: '+esc(it.category)+'</span>'
      +'<span class="tag">Report: '+esc(it.report_kind)+'</span>'
      +'<span class="tag">Verification: '+esc(it.verification)+'</span>'
      +'<span class="tag">Relevance: '+n1(it.relevance_score)+'</span>'
      +'<span class="tag">Mode: '+esc(it.analysis_mode)+'</span>'
      +(it.event_article_count>1?('<span class="tag">'+it.event_article_count
        +' headlines merged</span>'):'')
      +(it.is_update?'<span class="tag VERY_HIGH">UPDATE</span>':'')+'</div>'
      +'<div class="impacts">'+((it.impacts||[]).map(impactRow).join('')
        ||'<div class="row">No classified market impact.</div>')+'</div>'
      +(it.analysis_note?('<div class="wnote">'+esc(it.analysis_note)+'</div>'):'')
      +'</div></div>';
  }).join('');
  if(FEED.loaded<FEED.total) box.innerHTML+=moreButton();
}
/* ---- Feed paging ---------------------------------------------------------
   A busy day holds hundreds of articles, so /api/dashboard ships the first
   page only and this pulls the rest from /api/news on demand. Paging is
   server-side and offset-based against a strict newest-first ordering that
   carries an id tiebreaker, so consecutive pages cannot duplicate or skip. */
function moreButton(){
  var remain=FEED.total-FEED.loaded;
  return '<div class="feedmore"><button data-more="1"'
    +(FEED.busy?' disabled':'')+'>'+(FEED.busy?'Loading…':'Load more ('
      +Math.min(FEED.page,remain)+' of '+remain+' remaining)')+'</button>'
    +'<span class="fcount">Showing '+FEED.loaded+' of '+FEED.total
    +' articles today</span></div>';
}
async function loadMore(){
  if(FEED.busy||FEED.loaded>=FEED.total) return;
  FEED.busy=true; renderFeed(FEED.items);
  try{
    const r=await fetch('/api/news?offset='+FEED.loaded+'&limit='+FEED.page);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    /* Merge by id instead of trusting a blind append: if a new article landed
       since the previous page was drawn, the server's offset window has
       shifted, so concatenation could otherwise duplicate a row. */
    var seen={}, merged=[];
    FEED.items.concat(d.items||[]).forEach(function(it){
      if(!seen[it.id]){ seen[it.id]=1; merged.push(it); }
    });
    merged.sort(function(a,b){
      if(a.published_at_utc===b.published_at_utc) return (b.id||0)-(a.id||0);
      return a.published_at_utc<b.published_at_utc?1:-1;
    });
    FEED.items=merged;
    if(typeof d.total==='number') FEED.total=d.total;
    FEED.loaded=FEED.items.length;
  }catch(e){ console.error(e); }
  FEED.busy=false; renderFeed(FEED.items);
}
/* ---- FinancialJuice Session Analysis -----------------------------------
   LEGACY SCORING - deliberately NOT converted to Bias/score/confidence.

   This section runs a separate, older scorer (fj_sessions.py) that still emits
   a forced bull_pct/bear_pct pair summing to 100. It scores ONE publisher's
   session report with its own weighted-cue model, not the main news pipeline.

   It is labelled in the UI so a reader never confuses the two systems:
     * the main engine panels above publish BULLISH / BEARISH / NO_BIAS;
     * this section publishes a split that ALWAYS sums to 100 and therefore
       cannot express "no view".

   Converting it would change published numbers for existing users, so it is
   flagged rather than silently rewritten.
   TODO(unify-fj): port fj_sessions onto the transmission map and the NO_BIAS
   contract, then remove this banner. */
function fjAsset(a){
  var bull=+a.bull_pct||0, bear=+a.bear_pct||0;
  var dv=(a.drivers&&a.drivers.length)?a.drivers.slice(0,3).join(' \u00b7 '):'';
  return '<div class="fja">'
    +'<div class="an">'+esc(a.label)+' <span style="color:var(--dim)">'
      +esc(a.asset)+'</span></div>'
    +'<div class="pct '+(bull>=bear?'bull':'bear')+'">'
      +n1(bull>=bear?bull:bear)+'%</div>'
    +'<div class="pcb"><span class="bull">\ud83d\udfe2 Bullish '+n1(bull)
      +'%</span> <span style="color:var(--dim)">|</span> '
      +'<span class="bear">\ud83d\udd34 Bearish '+n1(bear)+'%</span></div>'
    +'<div class="bb"><div class="b" style="width:'+w(bull)+'%"></div>'
      +'<div class="s" style="width:'+w(bear)+'%"></div></div>'
    +'<div class="dv">'+esc(dv)+'</div>'
    +'</div>';
}
function renderFinancialJuice(d){
  var box=document.getElementById('fjWrap');
  if(!d||!d.boxes||!d.boxes.length){
    box.innerHTML='<div class="fjpending">FinancialJuice session data '
      +'unavailable.</div>';
    return;
  }
  var html='<div class="fjhead">'
    +'<span class="ft">FINANCIALJUICE SESSION ANALYSIS</span>'
    +'<span class="fd">Indian Date: '+esc(d.india_date_display||d.india_date)
      +'</span>'
    +'<span class="fz">Source: FinancialJuice only &middot; times in '
      +esc(d.timezone)+' &middot; Bullish + Bearish = 100%</span>'
    +'</div>'
    /* Explicit legacy marker: the difference from the main engine must be
       impossible to miss. */
    +'<div class="fjlegacy">LEGACY SCORING &mdash; this section uses a separate '
    +'older scorer and reports a forced Bullish+Bearish=100% split. The engine '
    +'panels above use the current contract (BULLISH / BEARISH / NO_BIAS with a '
    +'signed score and confidence) and can report "no view". Do not compare the '
    +'numbers between this section and the rest of the dashboard.</div>';

  /* The order here is whatever the API returned, which the backend fixes to
     US Market Wrap, Asian Market Wrap, Europe Market Prep, Europe Market
     Wrap, US Session Prep. It is never re-sorted here. */
  if(d.context&&(d.context.news_items||d.context.calendar_items)){
      html+='<div class="fjctx">Scored against the FinancialJuice report PLUS '
        +'high-impact news (<b>'+(d.context.news_items||0)+'</b> Section B '
        +'items) and economic-calendar signals (<b>'
        +(d.context.calendar_items||0)+'</b>).</div>';
    }
    d.boxes.forEach(function(b,i){
    var badge = b.found
      ? '<span class="fjbadge '+(b.is_today?'today':'prev')+'">'
        +esc(b.age_label||'')+'</span>'
      : '';
    html+='<div class="fjbox'+(b.found&&b.is_today?'':' pending')+'">'
      +'<div class="fjbh"><span class="n">'+(i+1)+'</span>'
      +'<span class="nm">'+esc(b.title.toUpperCase())+'</span>'
      +badge
      +'<span class="ts">'+esc(b.published_ist||'No report yet')+'</span>'
      +'</div>';
    if(b.found&&b.report_title){
      html+='<div class="fjrt">'+esc(b.report_title)+'</div>';
      if(!b.is_today&&b.report_date_display){
        html+='<div class="fjprevnote">Showing the most recent available '
          +'report &mdash; dated '+esc(b.report_date_display)
          +'. Today\'s report has not been published by FinancialJuice yet.'
          +'</div>';
      }
    }
    if(b.found){
      html+='<div class="fjgrid">'+(b.assets||[]).map(fjAsset).join('')+'</div>';
    }else{
      html+='<div class="fjpending">Awaiting today\'s FinancialJuice '
        +esc(b.title)+' report. Showing an even 50/50 split rather than '
        +'inventing a signal.</div>';
      html+='<div class="fjgrid">'+(b.assets||[]).map(fjAsset).join('')+'</div>';
    }
    /* TOP DRIVERS / KEY RISKS read off THIS box's own session report, via the
       same two-note component the MARKET PREP cards use. Drawn for all five
       boxes - found or not - so the section reads as one consistent set; an
       empty side says "None flagged." instead of being hidden. */
    html+='<div class="fjdrv">'
      +mnote('drv','TOP DRIVERS',b.drivers,3)
      +mnote('rsk','KEY RISKS',b.risks,3)+'</div>';
    html+='</div>';
  });
  box.innerHTML=html;
}
function renderHeader(d){
  var st=d.status||{};
  document.getElementById('meta').innerHTML=
    '<span><span class="dot '+(st.running?'on':'')+'"></span>'
    +(st.running?'RUNNING':'IDLE')+'</span>'
    +'<span>DATE <b>'+esc(d.date)+'</b></span>'
    +'<span>TIME <b>'+esc(d.current_time)+'</b></span>'
    +'<span>SESSION <b>'+esc(d.current_session)+'</b></span>'
    +'<span>REGIME <b>'+esc(d.regime)+'</b></span>'
    +'<span>MODE <b>'+esc(st.analysis_mode)+'</b></span>'
    +'<span>ARTICLES <b>'+(st.articles_today||0)+'</b></span>'
    +'<span>EVENTS <b>'+(st.events_today||0)+'</b></span>'
    +'<span>SOURCES <b>'+(st.sources_ok||0)+'/'+(st.sources_polled||0)+'</b></span>'
    +'<span>NEW <b>'+(st.new_news_since_last_update||0)+'</b></span>'
    +'<span>POLL <b>'+(st.poll_interval_seconds||0)+'s</b></span>'
    +'<span>UPDATED <b>'+esc(st.last_updated||'n/a')+'</b></span>';
  var dr=d.regime_drivers||[];
  document.getElementById('regime').innerHTML=
    '<div class="regime"><b>MARKET REGIME:</b> '+esc(d.regime)
    +' &middot; confidence '+n1((+d.regime_confidence||0)*100)+'%'
    +' &middot; market TZ '+esc(d.market_timezone)
    +' &middot; display TZ '+esc(d.display_timezone)
    +'<ul>'+dr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
}
function renderFilters(){
  var opts=[['ALL','ALL'],['HIGH','HIGH IMPORTANCE'],['XAUUSD','GOLD'],
    ['XAGUSD','SILVER'],['BTCUSD','BITCOIN']];
  document.getElementById('filters').innerHTML=opts.map(function(o){
    return '<button data-f="'+o[0]+'" class="'+(activeFilter===o[0]?'on':'')+'">'
      +o[1]+'</button>';
  }).join('')
    +'<span class="fcount">Click a headline to expand its impact breakdown</span>';
}
function render(d){
  DATA=d;
  renderHeader(d);
  renderPrepStrip(d.assets);
  renderAssets(d.assets);
  renderAlerts(d.alerts);
  /* Seed the feed from the payload's first page. On a refresh the page-1 rows
     are replaced, but anything the reader already paged in is kept, so a 30s
     auto-refresh does not silently collapse an expanded feed back to 60. */
  var first=d.news_feed||[];
  if(!FEED.loaded){
    FEED.items=first.slice();
    FEED.loaded=FEED.items.length;
  }else{
    var byId={}; FEED.items.forEach(function(it){byId[it.id]=it;});
    first.forEach(function(it){byId[it.id]=it;});
    FEED.items=Object.keys(byId).map(function(k){return byId[k];});
    FEED.items.sort(function(a,b){
      if(a.published_at_utc===b.published_at_utc) return (b.id||0)-(a.id||0);
      return a.published_at_utc<b.published_at_utc?1:-1;
    });
    FEED.loaded=FEED.items.length;
  }
  if(typeof d.news_feed_total==='number') FEED.total=d.news_feed_total;
  else FEED.total=Math.max(FEED.total,FEED.loaded);
  renderFeed(FEED.items);
  document.getElementById('disclaimer').textContent=d.disclaimer||'';
}
async function load(){
  try{
    const r=await fetch('/api/dashboard');
    render(await r.json());
  }catch(e){ console.error(e); }
  loadFinancialJuice();
}
/* FinancialJuice Session Analysis is served by its own read-only endpoint so
   the main dashboard payload is left byte-for-byte unchanged. It reuses the
   rows the existing pipeline already ingested - no second FJ connection. */
async function loadFinancialJuice(){
  try{
    const r=await fetch('/api/financialjuice/sessions');
    renderFinancialJuice(await r.json());
  }catch(e){ console.error(e); }
}
document.addEventListener('click',function(e){
  var card=e.target.closest('.mcard');
  if(card){
    var tgt=document.getElementById(card.getAttribute('data-goto'));
    if(tgt) tgt.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  var head=e.target.closest('.ihead');
  if(head){ head.parentNode.classList.toggle('open'); return; }
  var more=e.target.closest('[data-more]');
  if(more){ loadMore(); return; }
  var btn=e.target.closest('.filters button');
  if(btn){ activeFilter=btn.getAttribute('data-f'); renderFilters();
           renderFeed(FEED.items); }
});
function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host+'/ws');
  ws.onmessage=function(e){ try{ var m=JSON.parse(e.data);
      if(m.type==='update'){ load(); } }catch(_){} };
  ws.onclose=function(){ setTimeout(connect,backoff);
    backoff=Math.min(backoff*2,30000); };
  ws.onopen=function(){ backoff=1000; };
  setInterval(function(){ if(ws&&ws.readyState===1) ws.send('ping'); },25000);
}
renderFilters();
load(); connect(); setInterval(load,30000);
</script>
</body>
